server {
    listen 80;
    listen [::]:80;
    server_name passwisely.com www.passwisely.com;
    client_max_body_size 16m;

    # Dedicated HTTP/2 + protobuf channel for the desktop client. The website
    # remains on port 3011 and the desktop API is isolated on port 3012.
    location /passwisely.desktop.v1.DesktopAI/ {
        grpc_pass grpc://127.0.0.1:3012;
        grpc_set_header Host $host;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Keep stable website download paths while serving the three public release
    # objects directly from Alibaba Cloud OSS.
    location = /api/download/mac-arm64 {
        return 302 https://passwisely-releases-prod.oss-cn-beijing.aliyuncs.com/releases/v1.2.0/PassWisely-macOS-arm64.dmg;
    }

    location = /api/download/mac-x64 {
        return 302 https://passwisely-releases-prod.oss-cn-beijing.aliyuncs.com/releases/v1.2.0/PassWisely-macOS-x64.dmg;
    }

    location = /api/download/windows-x64 {
        return 302 https://passwisely-releases-prod.oss-cn-beijing.aliyuncs.com/releases/v1.2.0/PassWisely-Windows-x64.exe;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
