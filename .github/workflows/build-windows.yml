name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      signed_build:
        description: Require Windows Authenticode signing (WIN_CSC_LINK secret required)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build-windows.yml'
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'shared/**'
      - 'proto/**'
      - 'assets/**'
      - 'build/**'
      - 'desktop-api/tests/windows-package.test.mjs'
      - 'desktop-api/tests/windows-nsis-compat.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      REQUIRE_WINDOWS_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_build && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install native Windows dependencies
        run: npm ci
      - name: Verify Windows package-check contracts
        run: node --test desktop-api/tests/windows-package.test.mjs desktop-api/tests/windows-nsis-compat.test.mjs
      - name: Apply pinned upstream NSIS Windows compatibility backport
        shell: pwsh
        run: |
          $receiptDirectory = Join-Path $env:RUNNER_TEMP ('passwisely-nsis-compat-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $receiptDirectory -Force | Out-Null
          $receipt = & node scripts/apply-windows-nsis-compat.cjs
          $patchExit = $LASTEXITCODE
          $receipt | Set-Content -Encoding utf8NoBOM (Join-Path $receiptDirectory 'receipt.json')
          Write-Output $receipt
          if ($patchExit -ne 0) { throw 'Pinned NSIS compatibility backport failed; do not build an unknown installer template.' }
      - name: Build x64 NSIS installer without publishing
        env:
          WIN_CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_build && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_build && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        shell: pwsh
        run: |
          $builderFlags = @('--x64', '--publish', 'never', '-c.win.signAndEditExecutable=true')
          if ($env:REQUIRE_WINDOWS_SIGNING -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw 'Configure the WIN_CSC_LINK signing secret before requesting a signed build.' }
            $builderFlags += '-c.forceCodeSigning=true'
          } else {
            # electron-builder treats a present empty WIN_CSC_LINK as a path.
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm run dist:win -- @builderFlags
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
      - name: Preserve NSIS compatibility receipt after build cleanup
        if: always()
        shell: pwsh
        run: |
          $receiptPath = Join-Path $env:RUNNER_TEMP ('passwisely-nsis-compat-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '/receipt.json')
          if (Test-Path -LiteralPath $receiptPath -PathType Leaf) {
            New-Item -ItemType Directory -Path release -Force | Out-Null
            Copy-Item -LiteralPath $receiptPath -Destination release/windows-nsis-compat.json
          }
      - name: Check packaged Electron and Recall resources
        shell: pwsh
        run: |
          $verdict = & node scripts/verify-windows-runtime.cjs release/win-unpacked
          $probeExit = $LASTEXITCODE
          $verdict | Set-Content -Encoding utf8NoBOM release/windows-runtime.json
          Write-Output $verdict
          if ($probeExit -ne 0) { throw 'Packaged Windows runtime/import check failed.' }
      - name: Record and enforce requested Authenticode signing
        shell: pwsh
        run: |
          $report = @('release/win-unpacked/PassWisely.exe', 'release/PassWisely-Windows-x64.exe') | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_
            if ($env:REQUIRE_WINDOWS_SIGNING -eq 'true' -and $signature.Status -ne 'Valid') { throw "Required Authenticode validation failed for $(Split-Path $_ -Leaf)." }
            [pscustomobject]@{ file = (Split-Path $_ -Leaf); status = [string]$signature.Status; signedBuildRequested = ($env:REQUIRE_WINDOWS_SIGNING -eq 'true') }
          }
          $report | ConvertTo-Json | Set-Content -Encoding utf8NoBOM release/windows-signature.json
      - name: Smoke test per-user NSIS install and uninstall
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'This install smoke is restricted to disposable GitHub-hosted Windows runners.'
          }
          $installer = (Resolve-Path 'release/PassWisely-Windows-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP ('pw-nsis-' + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $installDir) { throw 'Smoke install directory must be new.' }
          $appExe = Join-Path $installDir 'PassWisely.exe'
          $appAsar = Join-Path $installDir 'resources/app.asar'
          $report = [ordered]@{
            success = $false
            scope = 'Actual per-user silent NSIS install, installed-package import/resources, and uninstall. No normal GUI startup, login, native agent init, recording, upload or ASR.'
            buildSourceCommit = $env:GITHUB_SHA
            installer = [ordered]@{
              file = (Split-Path $installer -Leaf)
              bytes = (Get-Item -LiteralPath $installer).Length
              sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            installDirectory = $installDir
            installExit = $null
            installStartUtc = $null
            installEndUtc = $null
            installProcessId = $null
            failure = $null
            cleanupFailure = $null
            installedRuntime = $null
            uninstallExit = $null
            installedPayloadRemoved = $false
          }
          $uninstaller = $null
          $primaryFailure = $null
          try {
            # NSIS /D must be last and unquoted, even if a path contains spaces.
            # This assisted installer does not start the app in silent mode.
            $report.installStartUtc = [datetime]::UtcNow.ToString('o')
            $install = Start-Process -FilePath $installer -ArgumentList "/S /currentuser /D=$installDir" -PassThru -Wait
            $report.installEndUtc = [datetime]::UtcNow.ToString('o')
            $report.installProcessId = $install.Id
            $report.installExit = $install.ExitCode
            $installExitText = if ($null -eq $report.installExit) { 'unknown (null ExitCode)' } else { [string]$report.installExit }
            Write-Output "NSIS silent install exit: $installExitText"
            if ($install.ExitCode -ne 0) { throw "NSIS silent install failed (installerExit=$installExitText)." }
            if (!(Test-Path -LiteralPath $appExe -PathType Leaf) -or !(Test-Path -LiteralPath $appAsar -PathType Leaf)) {
              throw 'NSIS did not install the expected executable and ASAR.'
            }
            $uninstallers = @(Get-ChildItem -LiteralPath $installDir -File -Filter 'Uninstall*.exe')
            if ($uninstallers.Count -ne 1) { throw 'Expected one uninstaller in the owned install directory.' }
            $uninstaller = $uninstallers[0].FullName
            $probe = & node scripts/verify-windows-runtime.cjs $installDir
            $probeExit = $LASTEXITCODE
            $report.installedRuntime = $probe | ConvertFrom-Json
            if ($probeExit -ne 0 -or $report.installedRuntime.success -ne $true) { throw 'Installed package verification failed.' }
          } catch {
            $primaryFailure = $_
          } finally {
            try {
              if ($null -ne $uninstaller -and (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
                # Same in-place _?= convention used by electron-builder's own
                # old-version removal; avoids treating only a detached launcher exit as completion.
                $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S /currentuser _?=$installDir" -PassThru -Wait
                $report.uninstallExit = $uninstall.ExitCode
                $report.installedPayloadRemoved = !(Test-Path -LiteralPath $appExe) -and !(Test-Path -LiteralPath $appAsar)
                if ($uninstall.ExitCode -ne 0 -or !$report.installedPayloadRemoved) { throw 'NSIS did not remove the installed application payload.' }
              } elseif (Test-Path -LiteralPath $appExe) {
                throw 'Installed executable remains without an owned uninstaller.'
              }
              $report.success = $null -eq $primaryFailure -and $report.installedPayloadRemoved
            } catch {
              $report.cleanupFailure = $_.Exception.Message
              if ($null -eq $primaryFailure) { $primaryFailure = $_ }
            }
            if ($null -ne $report.installStartUtc -and $null -eq $report.installEndUtc) { $report.installEndUtc = [datetime]::UtcNow.ToString('o') }
            if ($null -ne $primaryFailure) { $report.failure = $primaryFailure.Exception.Message }
            # Preserve diagnostic state on failure; do not delete files first and call that uninstall success.
            $report | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM release/windows-install.json
          }
          if ($null -ne $primaryFailure) { throw $primaryFailure }
          if (!$report.success) { throw 'NSIS install/uninstall smoke did not complete.' }
          # In-place NSIS can retain its running uninstaller. Remove only this
          # unique temporary directory after checking the real app files are gone.
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
      - name: Hash install and verification artifacts
        shell: pwsh
        run: |
          $report = Get-ChildItem release -File | Where-Object { $_.Name -like 'PassWisely-Windows-x64.exe*' -or $_.Name -eq 'latest.yml' -or $_.Name -like 'windows-*.json' } | Sort-Object Name | ForEach-Object {
            [pscustomobject]@{ file = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $report | ConvertTo-Json | Set-Content -Encoding utf8NoBOM release/windows-artifacts.json
      - name: Record failed build identity without publishing its installer
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $diagnostics = [ordered]@{
            success = $false
            workflowSourceCommit = $env:GITHUB_SHA
            checkedOutSourceCommit = $null
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            installerAfterFailure = $null
            metadataErrors = @()
          }
          try {
            $checkedOut = & git rev-parse HEAD
            if ($LASTEXITCODE -eq 0) { $diagnostics.checkedOutSourceCommit = [string]$checkedOut }
            else { $diagnostics.metadataErrors += 'SOURCE_COMMIT_UNAVAILABLE' }
          } catch { $diagnostics.metadataErrors += 'SOURCE_COMMIT_UNAVAILABLE' }
          $installerPath = Join-Path $env:GITHUB_WORKSPACE 'release/PassWisely-Windows-x64.exe'
          try {
            if (Test-Path -LiteralPath $installerPath -PathType Leaf) {
              $diagnostics.installerAfterFailure = [ordered]@{
                file = (Split-Path $installerPath -Leaf)
                bytes = (Get-Item -LiteralPath $installerPath).Length
                sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          } catch { $diagnostics.metadataErrors += 'INSTALLER_IDENTITY_UNAVAILABLE' }
          $diagnostics | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM release/windows-failure.json
      - name: Capture bounded installer crash module diagnostics
        if: failure()
        shell: pwsh
        timeout-minutes: 1
        run: |
          # Retain selected event fields only, never full event messages/XML or dumps.
          $diagnostics = [ordered]@{
            success = $false
            scope = 'Application Error 1000 / Windows Error Reporting 1001 for this installer attempt; absence does not establish no crash.'
            buildSourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            osVersion = [System.Environment]::OSVersion.VersionString
            powerShellVersion = $PSVersionTable.PSVersion.ToString()
            installerProcessId = $null
            queryStartUtc = $null
            queryEndUtc = $null
            maxEvents = 40
            eventLimitReached = $false
            fieldsTruncated = $false
            events = @()
            failureCode = $null
          }
          function Read-BoundedField($value) {
            if ($null -eq $value) { return $null }
            $text = [string]$value
            if ($text.Length -gt 512) { $diagnostics.fieldsTruncated = $true; return $text.Substring(0, 512) }
            return $text
          }
          try {
            if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'DISPOSABLE_WINDOWS_RUNNER_REQUIRED' }
            if (!(Test-Path -LiteralPath release/windows-install.json -PathType Leaf)) { throw 'NO_INSTALL_ATTEMPT_REPORT' }
            $installReport = Get-Content -LiteralPath release/windows-install.json -Raw | ConvertFrom-Json
            if (!$installReport.installStartUtc) { throw 'NO_INSTALL_ATTEMPT_START' }
            $diagnostics.installerProcessId = $installReport.installProcessId
            $start = ([datetimeoffset]::Parse($installReport.installStartUtc)).UtcDateTime
            $earliest = [datetime]::UtcNow.AddMinutes(-10)
            if ($start -lt $earliest) { $start = $earliest }
            $diagnostics.queryStartUtc = $start.ToString('o')
            $expectedPath = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'release/PassWisely-Windows-x64.exe'))
            $expectedName = [IO.Path]::GetFileName($expectedPath)
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              $end = [datetime]::UtcNow
              $diagnostics.queryEndUtc = $end.ToString('o')
              try {
                $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = @('Application Error', 'Windows Error Reporting'); Id = @(1000, 1001); StartTime = $start; EndTime = $end } -MaxEvents 40 -ErrorAction Stop)
              } catch {
                if ($_.FullyQualifiedErrorId -notlike 'NoMatchingEventsFound*') { throw 'EVENT_QUERY_FAILED' }
                $events = @()
              }
              $diagnostics.eventLimitReached = $events.Count -ge 40
              $selected = @()
              foreach ($event in $events) {
                $xml = [xml]$event.ToXml()
                $data = @{}
                foreach ($field in $xml.Event.EventData.Data) { $data[$field.GetAttribute('Name')] = $field.InnerText }
                if ($event.Id -eq 1000) {
                  if (![string]::Equals($data['AppPath'], $expectedPath, [StringComparison]::OrdinalIgnoreCase)) { continue }
                  $selected += [ordered]@{
                    eventId = 1000; recordId = $event.RecordId; createdUtc = $event.TimeCreated.ToUniversalTime().ToString('o')
                    matchBasis = 'exact-app-path+time-window'
                    appName = Read-BoundedField $data['AppName']; moduleName = Read-BoundedField $data['ModuleName']
                    moduleVersion = Read-BoundedField $data['ModuleVersion']; exceptionCode = Read-BoundedField $data['ExceptionCode']
                    faultOffset = Read-BoundedField $data['FaultingOffset']; processId = Read-BoundedField $data['ProcessId']
                  }
                } elseif ($event.Id -eq 1001) {
                  if (![string]::Equals($data['P1'], $expectedName, [StringComparison]::OrdinalIgnoreCase)) { continue }
                  # WER signature positions depend on EventName. Preserve their
                  # source names rather than assuming every report is APPCRASH.
                  $selected += [ordered]@{
                    eventId = 1001; recordId = $event.RecordId; createdUtc = $event.TimeCreated.ToUniversalTime().ToString('o')
                    matchBasis = 'app-name+time-window-candidate'
                    eventName = Read-BoundedField $data['EventName']; appName = Read-BoundedField $data['P1']
                    signature = [ordered]@{
                      P4 = Read-BoundedField $data['P4']; P5 = Read-BoundedField $data['P5']
                      P7 = Read-BoundedField $data['P7']; P8 = Read-BoundedField $data['P8']
                    }
                  }
                }
              }
              $diagnostics.events = $selected
              if ($selected.Count -gt 0 -or $attempt -eq 2) { break }
              Start-Sleep -Seconds 2
            }
            $diagnostics.success = $true
          } catch {
            $code = $_.Exception.Message
            $diagnostics.failureCode = if ($code -match '^[A-Z_]+$') { $code } else { 'EVENT_DIAGNOSTICS_FAILED' }
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $diagnostics | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM release/windows-installer-crash.json
      - name: Upload failed verification diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PassWisely-Windows-failed-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/windows-failure.json
            release/windows-installer-crash.json
            release/windows-runtime.json
            release/windows-signature.json
            release/windows-nsis-compat.json
            release/windows-install.json
            release/windows-artifacts.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installer and bounded verification reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PassWisely-Windows-x64-${{ github.event_name == 'workflow_dispatch' && inputs.signed_build && 'signed' || 'unsigned' }}
          path: |
            release/PassWisely-Windows-x64.exe
            release/PassWisely-Windows-x64.exe.blockmap
            release/latest.yml
            release/windows-runtime.json
            release/windows-signature.json
            release/windows-nsis-compat.json
            release/windows-install.json
            release/windows-artifacts.json
          if-no-files-found: error
          retention-days: 30
